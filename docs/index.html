<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>easy-house</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="easy-house — draw any apartment building as an SVG matrix of its units: a config that says only what differs, plugins on every level, events instead of dialogs.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="live.css">

    <!--
        Live examples import the library by its real package name: `import {House} from 'easy-house'`.
        importmap.js says what that name resolves to — unpkg on the published site, the sources of the
        repository when served locally — so the code shown in the docs is the code that actually runs.
    -->
    <script src="importmap.js"></script>
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'easy-house',
        repo: 'Liksu/easy-house',
        // No basePath: docsify takes the directory this page is served from, so the site works both
        // where it is deployed and from a plain local server.
        relativePath: true,
        loadSidebar: true,
        loadNavbar: true,
        subMaxLevel: 3,
        auto2top: true,
        alias: {
            '/.*/_sidebar.md': '/_sidebar.md',
            '/.*/_navbar.md': '/_navbar.md'
        },
        search: {
            depth: 3,
            placeholder: 'Search the docs',
            noData: 'Nothing found'
        },
        pagination: {
            previousText: 'Previous',
            nextText: 'Next',
            crossChapter: true,
            crossChapterText: true
        }
    }
</script>
<!-- Docsify v4 -->
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
<script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
<!-- Runs the `js live` blocks on the page -->
<script src="live.js"></script>
<!-- The configurator of the introduction -->
<script src="configurator.js"></script>
</body>
</html>
